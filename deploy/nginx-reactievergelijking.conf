# reactievergelijking — reverse proxy naar Next.js (PM2 poort 3017)
#
# Op de server:
#   sudo cp deploy/nginx-reactievergelijking.conf /etc/nginx/sites-available/reactievergelijking
#   sudo ln -sf /etc/nginx/sites-available/reactievergelijking /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Vervang SERVER_NAME hieronder door je echte domein (bijv. scheikunde.jouwdomein.nl)
# of laat hem weg om alleen op localhost te luisteren.

map $http_x_forwarded_proto $rv_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream rv_next {
    server 127.0.0.1:3017;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    access_log /var/log/nginx/reactievergelijking.access.log;
    error_log  /var/log/nginx/reactievergelijking.error.log;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Statische Next.js-assets (lang houdbaar) — optionele cache-boost.
    location /_next/static/ {
        proxy_pass http://rv_next;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://rv_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $rv_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        proxy_redirect off;
    }
}
